spring:
  application:
    name: payment-demo

  profiles:
    active: local


  # 클라이언트 API 계약 설정 파일 import
  config:
    import: optional:classpath:client-api-config.yml

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  security:
    user:
      name: demo
      password: demo123

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

# PortOne Configuration
portone:
  api:
    base-url: https://api.portone.io
    secret: ${PORTONE_API_SECRET:your-api-secret}
  store:
    id: ${PORTONE_STORE_ID:your-store-id}
  channel:
    kg-inicis: ${PORTONE_CHANNEL_KG:your-kg-inicis-channel-key}
    toss: ${PORTONE_CHANNEL_TOSS:your-toss-channel-key}
# JWT Configuration
jwt:
  secret: c3BhcnRhIG5iY2FtIHRlYW01IGZseWluZyBwYXltZW50IHNlcnZpY2UgcHJvamVjdA==


# UI Branding Configuration
app:
  ui:
    branding:
      app-name: CommerceHub
      tagline: 통합 커머스 플랫폼
      logo-text: 🏪 CommerceHub

logging:
  level:
    com.bootcamp.paymentdemo: DEBUG
    org.springframework.security: INFO
